# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TwoWayMiss Studio — Handcrafted 3D Wooden Maps</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --forest:       #1a2918;
  --forest-deep:  #0d1a0c;
  --forest-mid:   #2d4a28;
  --forest-light: #3d6435;
  --brass:        #b8922a;
  --brass-light:  #d4ac4a;
  --brass-pale:   #e8d08a;
  --cream:        #f5f0e8;
  --cream-dark:   #ece4d4;
  --parchment:    #f9f5ed;
  --dark-text:    #1a1a16;
  --mid-text:     #4a4a3a;
  --light-text:   #7a7a68;
  --divider:      rgba(184,146,42,0.25);
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  background: var(--forest-deep);
  color: var(--cream);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 300;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 60px;
  background: rgba(10,18,10,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid rgba(184,146,42,0.12);
}
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.22em;
  color: var(--brass-light);
  text-decoration: none;
  text-transform: uppercase;
}
.nav-links { display: flex; gap: 40px; list-style: none; }
.nav-links a {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.55);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--brass-light); }
.nav-cta {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--forest-deep);
  background: var(--brass);
  padding: 12px 26px;
  text-decoration: none;
  transition: background 0.25s, letter-spacing 0.25s;
}
.nav-cta:hover { background: var(--brass-light); letter-spacing: 0.4em; }

/* ── HERO ── */
.hero {
  min-height: 78vh;
  background: linear-gradient(160deg, #0a1209 0%, #1a2918 45%, #0d1a0c 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 150px 60px 90px;
  text-align: center;
}
.hero-grid-bg {
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(184,146,42,0.025) 80px, rgba(184,146,42,0.025) 81px),
    repeating-linear-gradient(0deg,  transparent, transparent 80px, rgba(184,146,42,0.025) 80px, rgba(184,146,42,0.025) 81px);
  pointer-events: none;
}
.hero-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 70% at 50% 40%, transparent 0%, rgba(10,18,10,0.65) 100%);
  pointer-events: none;
}
.eyebrow {
  display: block;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--brass-light);
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 0.8s ease forwards 0.2s;
  position: relative;
}
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(48px, 6vw, 92px);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--cream);
  opacity: 0;
  animation: fadeUp 1s ease forwards 0.4s;
  position: relative;
  max-width: 900px;
}
.hero-title em { font-style: italic; color: var(--brass-light); }
.hero-desc {
  margin-top: 28px;
  font-family: 'Libre Baskerville', serif;
  font-size: 15px;
  line-height: 1.9;
  color: rgba(245,240,232,0.55);
  max-width: 560px;
  opacity: 0;
  animation: fadeUp 0.9s ease forwards 0.6s;
  position: relative;
}
.hero-stats {
  display: flex;
  gap: 0;
  margin-top: 56px;
  border-top: 0.5px solid var(--divider);
  padding-top: 36px;
  opacity: 0;
  animation: fadeUp 0.8s ease forwards 0.9s;
  position: relative;
}
.hero-stat { padding: 0 32px; border-right: 0.5px solid var(--divider); }
.hero-stat:last-child { border-right: none; }
.hero-stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 300;
  color: var(--brass-light);
  display: block;
  line-height: 1;
}
.hero-stat-lbl {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.35);
  display: block;
  margin-top: 8px;
}

/* Category tiles */
.category-tiles {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 1100px;
  width: 100%;
  margin-top: 64px;
  opacity: 0;
  animation: fadeUp 0.9s ease forwards 1.1s;
}
.category-tile {
  border: 0.5px solid rgba(184,146,42,0.3);
  background: rgba(184,146,42,0.03);
  padding: 40px 28px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.25s, background 0.25s, transform 0.25s;
}
.category-tile:hover { border-color: var(--brass-light); background: rgba(184,146,42,0.08); transform: translateY(-4px); }
.category-tile-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 400;
  color: var(--cream);
  display: block;
}
.category-tile-sub {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.4);
  display: block;
  margin-top: 10px;
}
.category-tile-count {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--brass-light);
  display: block;
  margin-top: 20px;
}

/* ── SECTION SHARED ── */
.section {
  padding: 100px 60px;
}
.section-inner { max-width: 1400px; margin: 0 auto; }
.section-eyebrow {
  display: block;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--brass);
  margin-bottom: 16px;
}
.section-heading {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 3.6vw, 56px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.01em;
  color: var(--forest);
}
.section-heading em { font-style: italic; color: var(--brass); }
.section-heading.on-dark { color: var(--cream); }
.section-heading.on-dark em { color: var(--brass-light); }
.section-desc {
  font-family: 'Libre Baskerville', serif;
  font-size: 14px;
  line-height: 1.9;
  color: var(--mid-text);
  max-width: 560px;
  margin-top: 20px;
}
.section-desc.on-dark { color: rgba(245,240,232,0.5); }

/* ── SIZES SECTION ── */
.sizes-section { background: var(--parchment); color: var(--dark-text); }
.size-compare {
  display: flex;
  align-items: flex-end;
  gap: 44px;
  margin-top: 72px;
  padding: 40px 0 0;
  border-bottom: 0.5px solid rgba(26,41,24,0.15);
  flex-wrap: wrap;
}
.size-compare-item { text-align: center; }
.size-compare-box {
  background: #1c0f05;
  border: 3px solid #3d2610;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(184,146,42,0.3);
  position: relative;
}
.size-compare-box::before {
  content: '';
  position: absolute; inset: 4px;
  border: 0.5px solid rgba(184,146,42,0.4);
}
.size-compare-label {
  margin-top: 18px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  color: var(--forest);
}
.size-compare-sub {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--light-text);
  margin-top: 4px;
}
.size-compare-note {
  font-size: 11px;
  color: var(--light-text);
  margin-top: 24px;
  letter-spacing: 0.05em;
}

/* ── WOOD SECTION ── */
.wood-section { background: var(--cream-dark); color: var(--dark-text); }
.wood-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: rgba(26,41,24,0.1);
  margin-top: 64px;
  border: 1px solid rgba(26,41,24,0.1);
}
.wood-card {
  background: var(--cream-dark);
  padding: 0;
  cursor: pointer;
  transition: background 0.25s;
  position: relative;
}
.wood-card:hover { background: #f0ebe0; }
.wood-card.active .wood-swatch { outline: 2px solid var(--brass); outline-offset: -2px; }
.wood-swatch { width: 100%; aspect-ratio: 1.3/1; }
.wood-card-body { padding: 22px 20px 26px; }
.wood-card-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  color: var(--forest);
  display: block;
}
.wood-card-desc {
  font-size: 12px;
  color: var(--light-text);
  line-height: 1.7;
  margin-top: 8px;
}
.wood-card-toggle {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brass);
  margin-top: 14px;
  display: block;
}

/* ── GALLERY EXPLORER ── */
.gallery-section { background: var(--forest-deep); border-top: 0.5px solid rgba(184,146,42,0.1); }

.filter-bar {
  margin-top: 56px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.filter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter-row-label {
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.35);
  min-width: 100px;
}
.pill {
  padding: 10px 20px;
  border: 0.5px solid rgba(184,146,42,0.3);
  background: transparent;
  color: rgba(245,240,232,0.6);
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
  white-space: nowrap;
}
.pill:hover { border-color: var(--brass-light); color: var(--cream); }
.pill.active { background: var(--brass); border-color: var(--brass); color: var(--forest-deep); font-weight: 400; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border: 0.5px solid rgba(184,146,42,0.25);
  background: transparent;
  color: rgba(245,240,232,0.55);
  font-family: 'Jost', sans-serif;
  font-size: 10.5px;
  font-weight: 300;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.chip:hover { border-color: var(--brass-light); color: var(--cream); }
.chip.active { border-color: var(--brass-light); background: rgba(184,146,42,0.15); color: var(--brass-pale); }
.chip-swatch {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.3);
  flex-shrink: 0;
}

.sort-select {
  background: transparent;
  border: 0.5px solid rgba(184,146,42,0.3);
  color: rgba(245,240,232,0.75);
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 16px;
  cursor: pointer;
}
.sort-select option { background: var(--forest-deep); color: var(--cream); }

.results-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 36px;
  padding-top: 24px;
  border-top: 0.5px solid rgba(184,146,42,0.12);
}
.results-count {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.4);
}
.results-clear {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--brass-light);
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'Jost', sans-serif;
}
.results-clear:hover { color: var(--brass-pale); }

/* Item grid */
.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 26px;
  margin-top: 32px;
}
.item-card {
  background: rgba(255,255,255,0.02);
  border: 0.5px solid rgba(184,146,42,0.12);
  transition: border-color 0.25s, transform 0.25s;
}
.item-card:hover { border-color: rgba(184,146,42,0.4); transform: translateY(-3px); }
.item-photo {
  aspect-ratio: 4/5;
  background: #171f16 center/cover no-repeat;
  border-bottom: 0.5px solid rgba(184,146,42,0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  position: relative;
}
.item-photo .upload-icon {
  width: 38px; height: 38px;
  border: 1px solid rgba(184,146,42,0.5);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--brass);
  font-size: 18px;
  transition: background 0.2s;
}
.item-photo:hover .upload-icon { background: rgba(184,146,42,0.1); }
.item-photo .upload-label {
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.3);
}
.item-photo.has-photo .upload-icon,
.item-photo.has-photo .upload-label { display: none; }
.item-photo-replace {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(10,18,10,0.85) 0%, transparent 100%);
  padding: 18px 14px 10px;
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.7);
  opacity: 0;
  transition: opacity 0.2s;
  text-align: center;
}
.item-photo:hover .item-photo-replace { opacity: 1; }

.item-body { padding: 20px 20px 22px; }
.item-cat-badge {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--brass-light);
}
.item-sub-label {
  font-size: 10.5px;
  letter-spacing: 0.05em;
  color: rgba(245,240,232,0.35);
  margin-top: 2px;
}
.item-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--cream);
  margin-top: 8px;
  line-height: 1.2;
}
.item-kind {
  font-size: 10px;
  color: rgba(245,240,232,0.3);
  margin-top: 4px;
  letter-spacing: 0.05em;
}
.item-sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
}
.size-badge {
  font-size: 9.5px;
  letter-spacing: 0.08em;
  padding: 5px 9px;
  border: 0.5px solid rgba(184,146,42,0.25);
  color: rgba(245,240,232,0.55);
  cursor: pointer;
  background: none;
  font-family: 'Jost', sans-serif;
  transition: border-color 0.2s, color 0.2s;
}
.size-badge:hover, .size-badge.active { border-color: var(--brass-light); color: var(--brass-pale); }
.item-woods {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
}
.wood-dot {
  width: 15px; height: 15px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  cursor: pointer;
  flex-shrink: 0;
}
.wood-dot.primary { box-shadow: 0 0 0 2px rgba(184,146,42,0.5); }

.empty-state {
  text-align: center;
  padding: 100px 20px;
  color: rgba(245,240,232,0.35);
}
.empty-state span {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  color: rgba(245,240,232,0.55);
  display: block;
  margin-bottom: 12px;
}

/* Hidden file input */
input[type="file"] { display: none; }

/* ── CUSTOM CTA ── */
.cta-section {
  background: var(--forest);
  padding: 100px 60px;
  text-align: center;
}
.cta-inner { max-width: 700px; margin: 0 auto; }
.btn-primary {
  display: inline-block;
  padding: 18px 44px;
  background: var(--brass);
  color: var(--forest-deep);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  text-decoration: none;
  transition: background 0.25s, letter-spacing 0.25s;
  margin-top: 40px;
  border: none;
  cursor: pointer;
  font-family: 'Jost', sans-serif;
}
.btn-primary:hover { background: var(--brass-light); letter-spacing: 0.42em; }

/* ── FOOTER ── */
footer {
  background: #080f08;
  padding: 64px 60px 40px;
  border-top: 0.5px solid rgba(184,146,42,0.12);
}
.footer-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap: 60px;
  margin-bottom: 48px;
}
.footer-brand-col p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0.2em;
  color: var(--brass-light);
  margin-bottom: 14px;
  text-transform: uppercase;
}
.footer-brand-col span {
  font-size: 12px;
  color: rgba(245,240,232,0.25);
  line-height: 1.8;
  font-weight: 200;
  display: block;
}
.footer-col h4 {
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(245,240,232,0.4);
  font-weight: 400;
  margin-bottom: 18px;
}
.footer-col a {
  display: block;
  font-size: 13px;
  color: rgba(245,240,232,0.25);
  text-decoration: none;
  margin-bottom: 9px;
  font-weight: 200;
  transition: color 0.2s;
}
.footer-col a:hover { color: var(--brass-light); }
.footer-bottom {
  max-width: 1400px;
  margin: 0 auto;
  padding-top: 28px;
  border-top: 0.5px solid rgba(184,146,42,0.08);
  font-size: 11px;
  color: rgba(245,240,232,0.2);
  font-weight: 200;
  letter-spacing: 0.08em;
}

/* ── SCROLL REVEAL ── */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.8s ease, transform 0.8s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
  nav { padding: 0 24px; }
  .nav-links { display: none; }
  .hero, .section, .cta-section, footer { padding-left: 24px; padding-right: 24px; }
  .category-tiles { grid-template-columns: 1fr; }
  .wood-grid { grid-template-columns: repeat(2, 1fr); }
  .footer-inner { grid-template-columns: 1fr 1fr; }
  .filter-row-label { min-width: 100%; }
}
</style>
</head>
