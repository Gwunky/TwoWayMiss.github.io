};

const CATEGORY_LABELS = { golf: 'Golf', city: 'City', other: 'Other' };

const ITEMS = [
  { id:'sh-7',    category:'golf', sub:'shinnecock', title:'Hole 7 — Redan',  kind:'Individual Hole', sizes:['8x10','11x14'], woods:['walnut','maple'],        primaryWood:'walnut' },
  { id:'sh-11',   category:'golf', sub:'shinnecock', title:'Hole 11',         kind:'Individual Hole', sizes:['8x10','11x14'], woods:['walnut','black'],        primaryWood:'black' },
  { id:'sh-18',   category:'golf', sub:'shinnecock', title:'Hole 18 — Home',  kind:'Individual Hole', sizes:['11x14'],        woods:['walnut','black'],        primaryWood:'walnut' },
  { id:'sh-full', category:'golf', sub:'shinnecock', title:'Full Course Map', kind:'Full Course Map', sizes:['11x14'],        woods:['walnut','maple','black'],primaryWood:'walnut' },

  { id:'sv-1',    category:'golf', sub:'seville',    title:'Hole 1',          kind:'Individual Hole', sizes:['8x10','11x14'], woods:['walnut','maple'],        primaryWood:'maple' },
  { id:'sv-9',    category:'golf', sub:'seville',    title:'Hole 9',          kind:'Individual Hole', sizes:['8x10','11x14'], woods:['walnut','black'],        primaryWood:'walnut' },
  { id:'sv-18',   category:'golf', sub:'seville',    title:'Hole 18 — Home',  kind:'Individual Hole', sizes:['11x14'],        woods:['walnut','black'],        primaryWood:'black' },
  { id:'sv-full', category:'golf', sub:'seville',    title:'Full Course Map', kind:'Full Course Map', sizes:['11x14'],        woods:['walnut','maple','black'],primaryWood:'walnut' },

  { id:'ne-downtown', category:'city', sub:'neenah',    title:'Downtown Neenah',          kind:'City View',     sizes:['8x10','11x14'], woods:['walnut','black'],         primaryWood:'walnut' },
  { id:'ne-riverside', category:'city', sub:'neenah',   title:'Riverside Park',           kind:'District Map',  sizes:['8x10','11x14'], woods:['maple','walnut'],         primaryWood:'maple' },
  { id:'ne-lake',      category:'city', sub:'neenah',   title:'Lake Winnebago Shoreline', kind:'City View',     sizes:['11x14'],        woods:['black','walnut'],         primaryWood:'black' },
  { id:'ne-full',      category:'city', sub:'neenah',   title:'Full City Map',            kind:'Full City Map', sizes:['11x14'],        woods:['walnut','maple','black'], primaryWood:'walnut' },

  { id:'sc-downtown', category:'city', sub:'santacruz', title:'Downtown Santa Cruz', kind:'City View',     sizes:['8x10','11x14'], woods:['walnut','maple'], primaryWood:'walnut' },
  { id:'sc-wharf',    category:'city', sub:'santacruz', title:'Santa Cruz Wharf',    kind:'District Map',  sizes:['8x10','11x14'], woods:['black','maple'],  primaryWood:'black' },
  { id:'sc-cliff',    category:'city', sub:'santacruz', title:'West Cliff Drive',    kind:'District Map',  sizes:['8x10','11x14'], woods:['maple','walnut'], primaryWood:'maple' },
  { id:'sc-full',     category:'city', sub:'santacruz', title:'Full City Map',       kind:'Full City Map', sizes:['11x14'],        woods:['walnut','black'], primaryWood:'walnut' },

  { id:'gi-heritage', category:'city', sub:'gilbert', title:'Heritage District',  kind:'District Map',  sizes:['8x10','11x14'], woods:['black','walnut'],         primaryWood:'black' },
  { id:'gi-downtown', category:'city', sub:'gilbert', title:'Downtown Gilbert',   kind:'City View',     sizes:['8x10','11x14'], woods:['maple','walnut'],         primaryWood:'maple' },
  { id:'gi-santan',   category:'city', sub:'gilbert', title:'San Tan Village',    kind:'District Map',  sizes:['11x14'],        woods:['walnut','black'],         primaryWood:'walnut' },
  { id:'gi-full',     category:'city', sub:'gilbert', title:'Full City Map',      kind:'Full City Map', sizes:['11x14'],        woods:['walnut','maple','black'], primaryWood:'black' },

  { id:'pk-yellowstone', category:'other', sub:'parks', title:'Yellowstone',    kind:'Landscape Piece', sizes:['8x10','11x14'], woods:['walnut','black'], primaryWood:'black' },
  { id:'pk-yosemite',    category:'other', sub:'parks', title:'Yosemite Valley', kind:'Landscape Piece', sizes:['8x10','11x14'], woods:['maple','walnut'],primaryWood:'maple' },
  { id:'pk-grandcanyon', category:'other', sub:'parks', title:'Grand Canyon',   kind:'Landscape Piece', sizes:['11x14'],        woods:['black','walnut'],primaryWood:'black' },
  { id:'pk-zion',        category:'other', sub:'parks', title:'Zion Canyon',    kind:'Landscape Piece', sizes:['8x10','11x14'], woods:['maple','black'], primaryWood:'maple' },

  { id:'co-tahoe',    category:'other', sub:'coastal', title:'Lake Tahoe',              kind:'Landscape Piece', sizes:['8x10','11x14'], woods:['walnut','maple'],         primaryWood:'walnut' },
  { id:'co-mv',       category:'other', sub:'coastal', title:"Martha's Vineyard",       kind:'Landscape Piece', sizes:['8x10','11x14'], woods:['maple','walnut'],         primaryWood:'maple' },
  { id:'co-obx',      category:'other', sub:'coastal', title:'Outer Banks',             kind:'Landscape Piece', sizes:['11x14'],        woods:['black','walnut'],         primaryWood:'black' },
  { id:'co-michigan', category:'other', sub:'coastal', title:'Lake Michigan Shoreline',  kind:'Landscape Piece', sizes:['11x14'],        woods:['walnut','maple','black'], primaryWood:'maple' },

  { id:'cu-property', category:'other', sub:'custom', title:'Custom Property Map',          kind:'Custom Commission', sizes:['8x10','11x14'], woods:['walnut','maple','black'], primaryWood:'walnut' },
  { id:'cu-ski',      category:'other', sub:'custom', title:'Custom Ski Resort Trail Map',  kind:'Custom Commission', sizes:['11x14'],        woods:['walnut','black'],         primaryWood:'black' },
  { id:'cu-vineyard', category:'other', sub:'custom', title:'Custom Vineyard Map',          kind:'Custom Commission', sizes:['8x10','11x14'], woods:['maple','walnut'],         primaryWood:'maple' },
  { id:'cu-estate',   category:'other', sub:'custom', title:'Custom Estate Grounds',        kind:'Custom Commission', sizes:['11x14'],        woods:['black','walnut'],         primaryWood:'black' }
];

/* ───────────────────────── STATE ───────────────────────── */
const state = {
  category: 'all',
  sub: null,
  woods: new Set(),
  sizes: new Set(),
  sort: 'featured'
};

/* ───────────────────────── RENDER: STATIC WIDGETS ───────────────────────── */
function renderSizeCompare() {
  const scale = 12; // px per inch
  const el = document.getElementById('size-compare');
  el.innerHTML = Object.entries(SIZES).map(([key, s]) => `
    <div class="size-compare-item">
      <div class="size-compare-box" style="width:${s.w*scale}px; height:${s.h*scale}px;"></div>
      <div class="size-compare-label">${s.w} × ${s.h}</div>
      <div class="size-compare-sub">inches</div>
    </div>
  `).join('');
}

function renderWoodGrid() {
  const el = document.getElementById('wood-grid');
  el.innerHTML = Object.entries(WOODS).map(([key, w]) => `
    <div class="wood-card" id="wood-card-${key}" onclick="toggleWood('${key}')">
      <div class="wood-swatch" style="background:${w.hex};"></div>
      <div class="wood-card-body">
        <span class="wood-card-name">${w.label}</span>
        <p class="wood-card-desc">${w.desc}</p>
        <span class="wood-card-toggle" id="wood-toggle-${key}">Filter by ${w.label}</span>
      </div>
    </div>
  `).join('');
}

function renderCategoryPills() {
  const cats = ['all', 'golf', 'city', 'other'];
  const el = document.getElementById('category-pills');
  el.innerHTML = cats.map(c => `
    <button class="pill" id="cat-pill-${c}" onclick="setCategory('${c}')">${c === 'all' ? 'All Categories' : CATEGORY_LABELS[c]}</button>
  `).join('');
}

function renderSubPills() {
  const el = document.getElementById('sub-pills');
  if (state.category === 'all') { el.innerHTML = ''; return; }
  const subs = Object.entries(SUBCATEGORIES).filter(([id, s]) => s.category === state.category);
  el.innerHTML = `<button class="pill" id="sub-pill-all" onclick="setSub(null)">All ${CATEGORY_LABELS[state.category]}</button>` +
    subs.map(([id, s]) => `<button class="pill" id="sub-pill-${id}" onclick="setSub('${id}')">${s.label}</button>`).join('');
}

function renderWoodChips() {
  const el = document.getElementById('wood-chips');
  el.innerHTML = Object.entries(WOODS).map(([key, w]) => `
    <button class="chip" id="wood-chip-${key}" onclick="toggleWood('${key}')">
      <span class="chip-swatch" style="background:${w.hex};"></span>${w.label}
    </button>
  `).join('');
}

function renderSizeChips() {
  const el = document.getElementById('size-chips');
  el.innerHTML = Object.entries(SIZES).map(([key, s]) => `
    <button class="chip" id="size-chip-${key}" onclick="toggleSize('${key}')">${s.w}×${s.h}</button>
  `).join('');
}

/* ───────────────────────── FILTER / SORT LOGIC ───────────────────────── */
function getFilteredItems() {
  let items = ITEMS.filter(it => {
    if (state.category !== 'all' && it.category !== state.category) return false;
    if (state.sub && it.sub !== state.sub) return false;
    if (state.woods.size > 0 && !it.woods.some(w => state.woods.has(w))) return false;
    if (state.sizes.size > 0 && !it.sizes.some(s => state.sizes.has(s))) return false;
    return true;
  });

  const areaOf = (sizeKey) => SIZES[sizeKey].w * SIZES[sizeKey].h;

  switch (state.sort) {
    case 'wood':
      items.sort((a, b) => WOODS[a.primaryWood].label.localeCompare(WOODS[b.primaryWood].label) || a.title.localeCompare(b.title));
      break;
    case 'size':
      items.sort((a, b) => Math.min(...a.sizes.map(areaOf)) - Math.min(...b.sizes.map(areaOf)));
      break;
    case 'name':
      items.sort((a, b) => a.title.localeCompare(b.title));
      break;
    case 'category':
      items.sort((a, b) => a.category.localeCompare(b.category) || a.sub.localeCompare(b.sub) || a.title.localeCompare(b.title));
      break;
    default:
      break; // featured = original order
  }
  return items;
}

/* ───────────────────────── RENDER: GRID ───────────────────────── */
function renderGrid() {
  const items = getFilteredItems();
  const el = document.getElementById('item-grid');
  document.getElementById('results-count').textContent = `Showing ${items.length} of ${ITEMS.length} pieces`;

  if (items.length === 0) {
    el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span>No pieces match those filters.</span>Try clearing a wood or size filter.</div>`;
    return;
  }

  el.innerHTML = items.map(it => {
    const sub = SUBCATEGORIES[it.sub];
    return `
    <div class="item-card">
      <div class="item-photo" id="photo-${it.id}" data-id="${it.id}" onclick="triggerUpload('${it.id}')">
        <div class="upload-icon">+</div>
        <span class="upload-label">Add Photo</span>
        <div class="item-photo-replace">Click to replace photo</div>
      </div>
      <div class="item-body">
        <span class="item-cat-badge">${CATEGORY_LABELS[it.category]}</span>
        <div class="item-sub-label">${sub.label}</div>
        <div class="item-title">${it.title}</div>
        <div class="item-kind">${it.kind}</div>
        <div class="item-sizes">
          ${it.sizes.map(sKey => `<button class="size-badge ${state.sizes.has(sKey) ? 'active' : ''}" onclick="event.stopPropagation(); toggleSize('${sKey}')">${SIZES[sKey].w}×${SIZES[sKey].h}</button>`).join('')}
        </div>
        <div class="item-woods">
          ${it.woods.map(wKey => `<span class="wood-dot ${wKey === it.primaryWood ? 'primary' : ''}" title="${WOODS[wKey].label}${wKey === it.primaryWood ? ' (primary)' : ''}" style="background:${WOODS[wKey].hex};" onclick="event.stopPropagation(); toggleWood('${wKey}')"></span>`).join('')}
        </div>
      </div>
    </div>
  `;
  }).join('');
}

/* ───────────────────────── STATE MUTATORS ───────────────────────── */
function updateActivePills() {
  ['all', 'golf', 'city', 'other'].forEach(c => {
    const p = document.getElementById(`cat-pill-${c}`);
    if (p) p.classList.toggle('active', state.category === c);
  });
  const subAll = document.getElementById('sub-pill-all');
  if (subAll) subAll.classList.toggle('active', state.sub === null);
  Object.keys(SUBCATEGORIES).forEach(id => {
    const p = document.getElementById(`sub-pill-${id}`);
    if (p) p.classList.toggle('active', state.sub === id);
  });
  Object.keys(WOODS).forEach(key => {
    const chip = document.getElementById(`wood-chip-${key}`);
    if (chip) chip.classList.toggle('active', state.woods.has(key));
    const card = document.getElementById(`wood-card-${key}`);
    if (card) card.classList.toggle('active', state.woods.has(key));
    const toggle = document.getElementById(`wood-toggle-${key}`);
    if (toggle) toggle.textContent = state.woods.has(key) ? `Filtering: ${WOODS[key].label} ✕` : `Filter by ${WOODS[key].label}`;
  });
  Object.keys(SIZES).forEach(key => {
    const chip = document.getElementById(`size-chip-${key}`);
    if (chip) chip.classList.toggle('active', state.sizes.has(key));
  });
}

function updateCategoryCounts() {
  ['golf', 'city', 'other'].forEach(c => {
    const count = ITEMS.filter(it => it.category === c).length;
    const el = document.getElementById(`tile-count-${c}`);
    if (el) el.textContent = `${count} pieces`;
  });
}

function setCategory(cat) {
  state.category = cat;
  state.sub = null;
  renderSubPills();
  updateActivePills();
  renderGrid();
}

function setSub(subId) {
  state.sub = subId;
  updateActivePills();
  renderGrid();
}

function toggleWood(key) {
  if (state.woods.has(key)) state.woods.delete(key); else state.woods.add(key);
  updateActivePills();
  renderGrid();
}

function toggleSize(key) {
  if (state.sizes.has(key)) state.sizes.delete(key); else state.sizes.add(key);
  updateActivePills();
  renderGrid();
}

function setSort(value) {
  state.sort = value;
  renderGrid();
}

function clearFilters() {
  state.category = 'all';
  state.sub = null;
  state.woods.clear();
  state.sizes.clear();
  state.sort = 'featured';
  document.getElementById('sort-select').value = 'featured';
  renderSubPills();
  updateActivePills();
  renderGrid();
}

function jumpToCategory(cat) {
  setCategory(cat);
  document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
}

/* ───────────────────────── PHOTO UPLOAD ───────────────────────── */
let pendingUploadId = null;
function triggerUpload(id) {
  pendingUploadId = id;
  document.getElementById('global-upload').click();
}
function handleFileSelected(e) {
  const file = e.target.files[0];
  if (!file || !pendingUploadId) return;
  const reader = new FileReader();
  reader.onload = function (ev) {
    const slot = document.getElementById(`photo-${pendingUploadId}`);
    if (slot) {
      slot.style.backgroundImage = `url(${ev.target.result})`;
      slot.classList.add('has-photo');
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

/* ───────────────────────── SCROLL REVEAL ───────────────────────── */
function initReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

